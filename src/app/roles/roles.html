<div class="roles-container">
  <div class="header-section">
    <div class="section-title">
      <mat-icon>lock_person</mat-icon>
      <h1>Gestión de Roles</h1>
    </div>
    <button class="btn-nuevo" (click)="abrirModalNuevo()">
      <mat-icon>add</mat-icon>
      Nuevo Rol
    </button>
  </div>

  <div class="table-card">
    <div class="table-container">
      <!-- Spinner de carga -->
      <div class="loading-container" *ngIf="loading">
        <mat-spinner diameter="40"></mat-spinner>
        <span>Cargando roles...</span>
      </div>

      <!-- Tabla -->
      <table mat-table [dataSource]="roles" *ngIf="!loading && roles.length > 0">
        <!-- Nombre -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre del Rol</th>
          <td mat-cell *matCellDef="let r">
            <div class="role-name-cell">
              <span class="role-name">{{ r.name }}</span>
            </div>
          </td>
        </ng-container>

        <!-- Descripción -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let r">{{ r.description }}</td>
        </ng-container>

        <!-- Módulos (Permisos) -->
        <ng-container matColumnDef="modules">
          <th mat-header-cell *matHeaderCellDef>Módulos / Permisos</th>
          <td mat-cell *matCellDef="let r">
            <div class="modules-wrap">
              <span class="badge-module" *ngFor="let m of r.modules">{{ m.name }}</span>
              <span class="muted small" *ngIf="!r.modules?.length">Sin permisos asignados</span>
            </div>
          </td>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="center">Acciones</th>
          <td mat-cell *matCellDef="let r">
            <div class="actions">
              <button class="btn-act edit" title="Editar Rol" (click)="editarRol(r)">
                <mat-icon>edit</mat-icon>
              </button>
              <button class="btn-act del" title="Eliminar Rol" (click)="eliminarRol(r)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Estado vacío -->
      <div class="no-data" *ngIf="!loading && roles.length === 0">
        <mat-icon>info</mat-icon>
        <span>No se encontraron roles configurados.</span>
      </div>
    </div>
  </div>
</div>
