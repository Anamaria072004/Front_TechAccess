<div class="vehiculos-container">

  <div class="page-header">
    <div class="header-info">
      <h1>Gestión de Vehículos</h1>
      <p>Registra y consulta los vehículos autorizados en el sistema.</p>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
          type="text" 
          [value]="filtroTexto"
          (input)="aplicarFiltro($event)" 
          placeholder="Buscar..." 
          class="search-input"
        >
        @if (filtroTexto) {
          <button class="clear-btn" (click)="limpiarFiltro()" type="button">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <button mat-flat-button (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Registrar Vehículo
      </button>
    </div>
  </div>

  <div class="table-card">
    <app-data-table #tabla
      [dataSource]="vehiculos"
      [columns]="vehiculoColumns"
      [loading]="loading"
      (onEdit)="editarVehiculo($event)"
      (onDelete)="deleteVehiculo($event)">
      
    </app-data-table>
  </div>

  

</div>
