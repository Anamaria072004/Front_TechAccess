<div class="vehiculos-container">
  <div class="header-section">
    <h2 class="section-title">
      <mat-icon>directions_car</mat-icon>
      Gestión de Vehículos
    </h2>
    <button mat-raised-button class="btn-nuevo" (click)="openCreateDialog()">
      <mat-icon>add_circle</mat-icon>
      Registrar Vehículo
    </button>
  </div>

  <div class="table-card mat-elevation-z1">
    <app-data-table 
      [dataSource]="vehiculos"           
      [columns]="vehiculoColumns" 
      [loading]="loading"
      (onEdit)="editarVehiculo($event)"   
      (onDelete)="deleteVehiculo($event)"> 
    </app-data-table>
  </div>
</div>
