<div class="confirmar-salida-container">
  <div class="dialog-header-simple">
    <mat-icon class="icono-salida">logout</mat-icon>
    <h2>Confirmar Salida</h2>
  </div>

  <div class="dialog-body">
    <p class="mensaje">
      ¿Confirmar la <strong>salida</strong> de
    </p>
    <p class="nombre-usuario">{{ data.usuarioNombre }}</p>
    <p class="documento">Doc. {{ data.documento }}</p>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="cancelar()" [disabled]="guardando">
      Cancelar
    </button>
    <button 
      mat-raised-button 
      color="warn" 
      (click)="confirmar()" 
      [disabled]="guardando"
      class="btn-confirmar-salida"
    >
      @if (!guardando) {
        <mat-icon>logout</mat-icon>
      }
      @if (guardando) {
        <mat-spinner diameter="20"></mat-spinner>
      }
      {{ guardando ? 'Registrando...' : 'Confirmar Salida' }}
    </button>
  </div>
</div>
