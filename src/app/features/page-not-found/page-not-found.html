<div class="not-found-container">
  <mat-icon class="error-icon">search_off</mat-icon>
  <h1>404</h1>
  <p>¡Ups! La página que buscas no existe o no tienes permisos para verla.</p>
  <p class="sub-message">Verifica que tengas los permisos necesarios para acceder a esta sección.</p>
  <div class="button-group">
    <button mat-stroked-button (click)="goBack()" routerLink="/inicio">
      <mat-icon>home</mat-icon>
      Volver al inicio
    </button>
  </div>
</div>
