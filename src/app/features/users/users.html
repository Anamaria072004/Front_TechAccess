<div class="usuarios-container">
  <div class="header-section">
    <h2 class="section-title">
      <mat-icon>group</mat-icon>
      Gestión de Usuarios
    </h2>

    <div class="header-actions">
      @if (isVigilante) {
      <button mat-raised-button class="btn-visitante" (click)="registrarVisitante()">
        <mat-icon>person_add</mat-icon>
        Registrar Visitante
      </button>
      }

      @if (isAdmin) {
      <button mat-raised-button class="btn-nuevo" (click)="abrirModalNuevo()">
        <mat-icon>add_circle</mat-icon>
        Nuevo Usuario
      </button>
      }
    </div>
  </div>

  <div class="table-card mat-elevation-z1">
    <app-data-table 
      [dataSource]="usuarios" 
      [columns]="userColumns" 
      [loading]="loading" 
      (onEdit)="editarUsuario($event)"
      (onDelete)="eliminarUsuario($event)"
      (onView)="verUsuario($event)">
    </app-data-table>
  </div>
</div>
