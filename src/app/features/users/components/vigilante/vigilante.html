<div class="vigilante-container">
  <div class="page-header">
    <div class="header-info">
      <h1>
        <mat-icon class="shield-icon">security</mat-icon>
        Panel de Vigilancia
      </h1>
      <p>Gestiona el registro de visitantes al centro SENA.</p>
    </div>
    <div class="header-actions">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
          type="text" 
          [value]="filtroTexto"
          (input)="aplicarFiltro($event)" 
          placeholder="Buscar..." 
          class="search-input"
        >
        @if (filtroTexto) {
          <button class="clear-btn" (click)="limpiarFiltro()" type="button">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <button mat-flat-button class="btn-nuevo" (click)="abrirModalNuevoVisitante()"
        [disabled]="loading() || !visitanteRoleId()">
        <mat-icon>person_add</mat-icon>
        Nuevo Visitante
      </button>
    </div>
  </div>

  <div class="table-card">
    <app-data-table #tabla [columns]="userColumns" [dataSource]="usuarios()" [loading]="loading()" [showEdit]="true"
      [showDelete]="false" (onEdit)="editarVisitante($event)"
      (onDelete)="eliminarVisitante($event)" (onView)="verUsuario($event)">
    </app-data-table>
  </div>
</div>
