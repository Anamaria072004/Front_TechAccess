<div class="roles-container">

  <div class="page-header">
    <div class="header-info">
      <h1>Gestión de Roles</h1>
      <p>Define los roles del sistema y los módulos a los que cada uno tiene acceso.</p>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
          type="text" 
          [value]="filtroTexto"
          (input)="aplicarFiltro($event)" 
          placeholder="Buscar..." 
          class="search-input"
        >
        @if (filtroTexto) {
          <button class="clear-btn" (click)="limpiarFiltro()" type="button">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      <button mat-flat-button (click)="abrirModalNuevo()">
        <mat-icon>add</mat-icon>
        Nuevo Rol
      </button>
    </div>
  </div>

  <div class="table-card">
    <app-data-table #tabla
      [dataSource]="roles"
      [columns]="roleColumns"
      [loading]="loading"
      (onEdit)="editarRol($event)"
      (onDelete)="eliminarRol($event)">
    </app-data-table>
  </div>

</div>
