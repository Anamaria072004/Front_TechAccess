<div class="dialog-container">
  <div class="dialog-header">
    <h2>{{ isEdit ? 'Editar Rol y Permisos' : 'Crear Nuevo Rol' }}</h2>
    <button mat-icon-button (click)="close()" type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="roleForm">

      <p class="section-label">Información del Rol</p>
      <div class="dialog-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombre del Rol</mat-label>
          <input matInput formControlName="name" placeholder="Ej. Administrador" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Descripción</mat-label>
          <input matInput formControlName="description" placeholder="Resumen de funciones" required />
        </mat-form-field>
      </div>

      <p class="section-label">Permisos</p>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Módulos / Permisos</mat-label>
        <mat-select formControlName="moduleIds" multiple required>
          @for (m of modules; track m.id) {
            <mat-option [value]="m.id">
              {{ m.name }}
            </mat-option>
          }
        </mat-select>
        <mat-hint>Seleccione los módulos a los que este rol tendrá acceso.</mat-hint>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button (click)="close()">Cancelar</button>
    <button mat-flat-button color="primary" [disabled]="roleForm.invalid" (click)="save()">
      {{ isEdit ? 'Actualizar Rol' : 'Crear Rol' }}
    </button>
  </mat-dialog-actions>
</div>
