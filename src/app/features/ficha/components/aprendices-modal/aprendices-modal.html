<div class="dialog-header">
  <h2 mat-dialog-title>Aprendices vinculados - Ficha {{ data.numficha }}</h2>
  <button mat-icon-button mat-dialog-close><mat-icon>close</mat-icon></button>
</div>

<mat-dialog-content>
  @if (loading) {
    <div class="loading-state">Cargando aprendices...</div>
  } @else {
    <table mat-table [dataSource]="aprendices" class="w-full">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
        <td mat-cell *matCellDef="let a">{{ a.name }} {{ a.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="documento">
        <th mat-header-cell *matHeaderCellDef>Documento</th>
        <td mat-cell *matCellDef="let a">{{ a.docNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let a">{{ a.email }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['nombre', 'documento', 'email']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['nombre', 'documento', 'email']"></tr>
    </table>

    @if (aprendices.length === 0) {
      <div class="empty-state">No hay aprendices registrados en esta ficha.</div>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
