<div class="fichas-container">

  <div class="page-header">
    <div class="header-info">
      <h1>Gestión de Fichas</h1>
      <p>Administra las fichas de formación y sus aprendices asociados.</p>
    </div>
    <div class="header-actions">
      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input 
          type="text" 
          [value]="filtroTexto"
          (input)="aplicarFiltro($event)" 
          placeholder="Buscar..." 
          class="search-input"
        >
        @if (filtroTexto) {
          <button class="clear-btn" (click)="limpiarFiltro()" type="button">
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>

      @if (!isVigilante()) {
        <button mat-flat-button (click)="abrirModalNueva()">
          <mat-icon>add</mat-icon>
          Nueva Ficha
        </button>
      }
    </div>
  </div>

  <div class="table-card">
    <app-data-table #tabla
      [dataSource]="fichas" 
      [columns]="fichaColumns()" 
      [loading]="loading()" 
      [showEdit]="!isVigilante()"
      [showDelete]="!isVigilante()"
      (onView)="verAprendices($event)"
      (onEdit)="editarFicha($event)" 
      (onDelete)="eliminarFicha($event)">
    </app-data-table>
  </div>

</div>
