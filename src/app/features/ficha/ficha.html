<div class="fichas-container">
  <!-- Cabecera igual a Vehículos y Dispositivos -->
  <div class="header-section">
    <div class="section-title">
      <mat-icon>school</mat-icon>
      <h1>Gestión de Fichas</h1>
    </div>
    <button mat-raised-button class="btn-nuevo" (click)="abrirModalNueva()">
      <mat-icon>add</mat-icon>
      Nueva Ficha
    </button>
  </div>

  <!-- Contenedor de la Tabla Genérica -->
  <div class="table-card mat-elevation-z1">
    <app-data-table 
      [dataSource]="fichas"           
      [columns]="fichaColumns" 
      [loading]="loading"
      (onView)="verAprendices($event)"
      (onEdit)="editarFicha($event)"   
      (onDelete)="eliminarFicha($event)"> 
    </app-data-table>
  </div>
</div>
