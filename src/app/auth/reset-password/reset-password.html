<div class="reset-container">
  <mat-card class="reset-card">
    <mat-card-header>
      <div mat-card-avatar class="header-image">
        <mat-icon color="primary">lock_reset</mat-icon>
      </div>
      <mat-card-title>Nueva Contraseña</mat-card-title>
      <mat-card-subtitle>Ingresa tu nueva clave de acceso</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="resetForm" (ngSubmit)="onReset()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña nueva</mat-label>
          <input matInput 
                 [type]="hide ? 'password' : 'text'" 
                 formControlName="password" 
                 placeholder="Mínimo 6 caracteres">
          <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-hint>Usa una clave que no hayas usado antes</mat-hint>
          
          @if (resetForm.get('password')?.hasError('required')) {
            <mat-error>
              La contraseña es <strong>obligatoria</strong>
            </mat-error>
          }
          @if (resetForm.get('password')?.hasError('minlength')) {
            <mat-error>
              Debe tener al menos <strong>6 caracteres</strong>
            </mat-error>
          }
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button 
                  color="primary" 
                  type="submit" 
                  [disabled]="resetForm.invalid" 
                  class="btn-block">
            <mat-icon>save</mat-icon>
            Actualizar Contraseña
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
