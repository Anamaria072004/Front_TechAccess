<div class="dashboard-container">
  <mat-sidenav-container class="sidenav-container">
    
    <!-- 1. SIDEBAR IZQUIERDO (Menú de navegación) -->
    <mat-sidenav #sidenav mode="side" opened class="main-sidenav">
      <div class="logo-header">
        <!-- Logo del SENA -->
        <img src="assets/logo-sena-blanco.png" alt="SENA" class="sena-logo">
        <span class="brand-name">TechAccess</span>
      </div>

      <mat-nav-list>
        <!-- Enlace a Inicio (Cartas) -->
        <a mat-list-item routerLink="/dashboard/inicio" routerLinkActive="active-link">
          <mat-icon matListItemIcon>grid_view</mat-icon>
          <span matListItemTitle>Inicio</span>
        </a>

        <!-- Enlace a Usuarios -->
        <a mat-list-item routerLink="/dashboard/users" routerLinkActive="active-link">
          <mat-icon matListItemIcon>group</mat-icon>
          <span matListItemTitle>Usuarios</span>
        </a>

        <!-- Enlace a Vehículos -->
        <a mat-list-item routerLink="/dashboard/vehiculos" routerLinkActive="active-link">
          <mat-icon matListItemIcon>directions_car</mat-icon>
          <span matListItemTitle>Vehículos</span>
        </a>

        <!-- Enlace a Fichas -->
        <a mat-list-item routerLink="/dashboard/fichas" routerLinkActive="active-link">
          <mat-icon matListItemIcon>school</mat-icon>
          <span matListItemTitle>Fichas</span>
        </a>
      </mat-nav-list>

    </mat-sidenav>

    <!-- 2. CONTENIDO DERECHO (Toolbar + Vistas dinámicas) -->
    <mat-sidenav-content>
      
      <!-- TOOLBAR SUPERIOR -->
      <mat-toolbar class="top-toolbar">
        <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="title">Gestión de Acceso SENA</span>
        <span class="spacer"></span>
        
        <!-- Información del Usuario -->
        <span class="user-name">Hola, {{ userName }}</span>
        
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>account_circle</mat-icon>
        </button>
        
        <mat-menu #menu="matMenu">
          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>Mi Perfil</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Cerrar Sesión</span>
          </button>
        </mat-menu>
      </mat-toolbar>

      <div class="content-padding">
      
        <router-outlet></router-outlet>
      </div>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
