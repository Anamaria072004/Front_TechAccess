<div class="admin-layout">
  
  <!-- 1. SIDEBAR IZQUIERDO -->
  <aside class="admin-sidebar" [class.collapsed]="isCollapsed">
    <div class="logo-header">
      <img *ngIf="!isCollapsed" src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA" class="sena-logo">
    </div>

    <div class="nav-menu">
      <a class="nav-item" routerLink="/dashboard/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon *ngIf="!isCollapsed">grid_view</mat-icon>
        <span *ngIf="!isCollapsed">Inicio</span>
      </a>

      <a class="nav-item" routerLink="/dashboard/users" routerLinkActive="active">
        <mat-icon *ngIf="!isCollapsed">admin_panel_settings</mat-icon>
        <span *ngIf="!isCollapsed">Usuarios Admin</span>
      </a>

      <a class="nav-item" routerLink="/dashboard/aprendices" routerLinkActive="active">
        <mat-icon *ngIf="!isCollapsed">group</mat-icon>
        <span *ngIf="!isCollapsed">Aprendices</span>
      </a>

      <a class="nav-item" routerLink="/dashboard/roles" routerLinkActive="active">
        <mat-icon *ngIf="!isCollapsed">lock_person</mat-icon>
        <span *ngIf="!isCollapsed">Roles</span>
      </a>

      <a class="nav-item" routerLink="/dashboard/vehiculos" routerLinkActive="active">
        <mat-icon *ngIf="!isCollapsed">directions_car</mat-icon>
        <span *ngIf="!isCollapsed">Vehículos</span>
      </a>

      <a class="nav-item" routerLink="/dashboard/fichas" routerLinkActive="active">
        <mat-icon *ngIf="!isCollapsed">school</mat-icon>
        <span *ngIf="!isCollapsed">Fichas</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <mat-divider style="margin-bottom: 15px; border-color: rgba(255,255,255,0.2);"></mat-divider>
      <button mat-button color="warn" (click)="logout()" class="logout-btn">
        <mat-icon *ngIf="!isCollapsed">exit_to_app</mat-icon>
        <span *ngIf="!isCollapsed">Cerrar Sesión</span>
      </button>

      <div class="sidebar-copy" *ngIf="!isCollapsed">
        <p>Desarrollado por TechAccess<br>
        Servicio Nacional de Aprendizaje SENA</p>
      </div>
    </div>
  </aside>

  <!-- 2. CONTENIDO PRINCIPAL -->
  <main class="admin-main">
    
    <header class="admin-header mat-elevation-z2">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="header-title">Gestión de Acceso SENA</div>
      <div class="spacer"></div>
      <div class="user-greeting">
        Hola, <strong>{{ userName }}</strong>
      </div>
    </header>

    <div class="admin-content-area">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
